data:
  root: data/kitti
  frame_ids:
    - "000000"
    - "000001"
    - "000002"
    - "000003"
    - "000004"

detector:
  eps: 0.6
  min_points: 20
  oriented: true
  z_min: -0.9
  intensity_min: 0.38

nms:
  iou_threshold: 0.3

evaluation:
  iou_threshold: 0.5
  auxiliary_iou_thresholds:
    - 0.25

outputs:
  report_dir: outputs/reports
  batch_report_root: outputs/kitti_batch_eval
